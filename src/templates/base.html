<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      /* === Reset & Base === */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #111827;
      }

      a { text-decoration: none; color: inherit; }
      img { border: none; outline: none; display: block; }

      /* === Layout Classes === */
      .email-wrapper {
        width: 100%;
        padding: 40px 0;
        text-align: center;
        background-color: #f8fafc;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .email-header {
        background-color: #1b263a;
        padding: 24px 0;
        text-align: center;
      }

      /* Logo Style */
      .email-header img {
        width: 160px;
        margin: 0 auto;
      }

      .email-content {
        padding: 36px 42px;
        text-align: left;
      }

      .email-footer {
        border-top: 1px solid #e5e7eb;
        padding: 20px;
        font-size: 13px;
        color: #6b7280;
        text-align: center;
        background-color: #ffffff;
      }
      
      .button {
        display: inline-block;
        background-color: #1b263a;
        color: #ffffff !important;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 6px;
        margin-top: 24px;
        font-size: 15px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="email-wrapper">
      <div class="email-container">
        
        <div class="email-header">
          <img
            src="{{baseUrl}}/assets/finansaku_logo_horizontal.jpg"
            alt="FinanSaku Logo"
          />
        </div>

        <div class="email-content">
          {{#block "body"}}
          {{/block}}
        </div>

        <div class="email-footer">
          <p>&copy; 2025 FinanSaku. Semua hak cipta dilindungi.</p>
          <p>Email ini dikirim secara otomatis. Mohon untuk tidak membalas.</p>
        </div>

      </div>
    </div>
  </body>
</html>
