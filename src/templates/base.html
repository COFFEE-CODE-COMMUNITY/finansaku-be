<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>

    <style>
      /* === Reset & Base === */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #111827;
        -webkit-font-smoothing: antialiased;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      img {
        border: none;
        outline: none;
        text-decoration: none;
        display: block;
      }

      /* === Layout === */
      .email-wrapper {
        width: 100%;
        padding: 40px 0;
        text-align: center;
        background-color: #f8fafc;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      /* === Header === */
      .email-header {
        background-color: #1b263a;
        padding: 24px 0;
        text-align: center;
      }

      .email-header img {
        width: 160px;
        margin: 0 auto;
      }

      /* === Body === */
      .email-body {
        padding: 36px 42px;
        text-align: left;
      }

      .email-body h2 {
        font-size: 22px;
        margin-top: 0;
        margin-bottom: 12px;
        color: #111827;
      }

      .email-body p {
        font-size: 15px;
        line-height: 1.7;
        margin: 12px 0;
        color: #374151;
      }

      .button {
        display: inline-block;
        background-color: #1b263a;
        color: #ffffff !important;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 6px;
        margin-top: 24px;
        font-size: 15px;
        text-align: center;
      }

      /* === Footer === */
      .email-footer {
        border-top: 1px solid #e5e7eb;
        padding: 20px;
        font-size: 13px;
        color: #6b7280;
        text-align: center;
        background-color: #ffffff;
      }

      /* === Responsive === */
      @media only screen and (max-width: 640px) {
        .email-body {
          padding: 24px 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="email-wrapper">
      <div class="email-container">
        <!-- Header -->
        <div class="email-header">
          <img src="{{ config.API_BASE_URL }}/assets/finansaku_logo_horizontal.jpg" alt="FinanSaku Logo" />
        </div>

        <!-- Body -->
        <div class="email-body">
          {{#block "body"}}{{/block}}
        </div>

        <!-- Footer -->
        <div class="email-footer">
          FinanSaku Team — Coffee Code Community
        </div>
      </div>
    </div>
  </body>
</html>
