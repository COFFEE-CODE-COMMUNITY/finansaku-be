<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Verify Your Email - FinanSaku</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 24px 32px;
      }
      .button {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
      p {
        line-height: 1.6;
      }
      .footer {
        margin-top: 24px;
        font-size: 13px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Hello {{name}},</h2>
      <p>Welcome to FinanSaku! Please verify your email address to activate your account.</p>
      <p>
        <a href="{{verificationLink}}" class="button">Verify Email</a>
      </p>
      <p>This link will expire in 30 minutes. If you didn’t create a FinanSaku account, you can ignore this email.</p>
      <p class="footer">FinanSaku Backend — Coffee Code Community</p>
    </div>
  </body>
</html>
